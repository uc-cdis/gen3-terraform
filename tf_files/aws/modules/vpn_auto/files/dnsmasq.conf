# dnsmasq config for the VPN endpoint. Rendered by the vpn_auto module's userdata.
#
# Clients are pushed this instance's private address as their DNS server, so every
# lookup they make arrives here. Names in ${hosts_file} are answered locally with the
# internal load balancer addresses; everything else is forwarded upstream.
#
# This runs on the host rather than in the openvpn container, so DNS keeps working
# across container restarts and image pulls.

# Answer on all interfaces. Clients arrive over tun0, the resolver itself is reached
# on the instance's private address.
interface=*

# Drop in directory, so extra config can be added without editing this file
conf-dir=/etc/dnsmasq.d,.rpmnew,.rpmsave,.rpmorig

# The split horizon overrides. update-dnsmasq.sh owns this file and keeps the
# addresses in it current.
addn-hosts=${hosts_file}

# Do not take upstream servers from /etc/resolv.conf. Clients are pushed this instance
# as their resolver, so resolv.conf can end up pointing back here and the forward
# would loop.
no-resolv

# 169.254.169.253 is the VPC resolver's link local address. Reachable from any subnet
# and stable regardless of which VPC this lands in, which is what lets clients resolve
# internal AWS names and the internal load balancers behind them.
server=${upstream_dns}

# Do not forward names without a domain part, or private range answers from upstream
domain-needed
bogus-priv

# Internal ALB records have short TTLs and dnsmasq honours them, so caching here does
# not extend how long a stale address can be served.
cache-size=1000
